services:
  openplc-runtime:
    image: ghcr.io/autonomy-logic/openplc-runtime:v4.3.2
    container_name: openplc-runtime
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:502:502"
    cap_add:
      - SYS_NICE
    volumes:
      - openplc-runtime-data:/var/run/runtime
    restart: unless-stopped

volumes:
  openplc-runtime-data:
